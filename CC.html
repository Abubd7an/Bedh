<style>
  :root {

    --A2: #42a5f5;

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Tajawal', sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, #1a1829 0%, #0f0e17 100%);
    border-bottom: 2px solid var(--accent);
    padding: 2rem 2rem 1.5rem;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 32px rgba(0,0,0,0.5);
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    color: var(--accent);
    letter-spacing: 2px;
    direction: ltr;
  }

  header p {
    color: var(--muted);
    font-size: 1rem;
    margin-top: 0.4rem;
  }

  /* Stats Bar */
  .stats {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
  }

  .level-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }

  /* Controls */
  .controls {
    padding: 1.5rem 2rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .filter-btn {
    padding: 0.4rem 1.1rem;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    transition: all 0.2s;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #0f0e17; font-weight: 700; border-color: var(--accent); }

  .search-box {
    padding: 0.45rem 1.2rem;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    outline: none;
    min-width: 200px;
    direction: ltr;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--muted); }

  .counter {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 0.8rem;
    background: var(--bg);
  }

    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5rem;
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1.5px solid var(--border);
    overflow: hidden;
    transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
    animation: fadeInUp 0.4s ease both;
    cursor: pointer;
    position: relative;

    border-color: var(--accent);

    color: var(--accent);

    letter-spacing: 0.5px;

    border-radius: 8px;
    font-family: 'Fira Mono', monospace;

  .badge-A2 { background: rgba(66,165,245,0.15); color: var(--A2); border: 1px solid var(--A2); }

    align-items: flex-start;

    margin-top: 2px;
    font-family: 'Fira Mono', monospace;
    flex-shrink: 0;
    direction: ltr;

  .translation {
    font-size: 1rem;
    color: var(--text);
    line-height: 1.4;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 0.6rem 0;
  }

  .example-label {
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
    text-align: right;

    font-size: 0.82rem;

    padding: 2rem;
    color: var(--muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);

</style>
</head>

let currentLevel = 'all';
let currentSearch = '';

function getLevel(word) {
  // dominant level
  return word.level;
}

function renderCards(list) {
  const grid = document.getElementById('grid');
  const counter = document.getElementById('counter');
  grid.innerHTML = '';
  counter.textContent = `يُعرض ${list.length} كلمة من أصل ${words.length}`;

  if (list.length === 0) {
    grid.innerHTML = '<div class="no-results">لا توجد نتائج مطابقة 🔍</div>';
    return;
  }

  list.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.level = w.level;
    card.style.animationDelay = (i % 20) * 0.035 + 's';

    const meaningsHtml = w.meanings.map(m => `
      <div class="meaning-row">
        <span class="translation">${m.ar}</span>
        <span class="pos-tag">${m.pos}</span>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="card-header">
        <span class="word-en">${w.word}</span>
        <span class="level-badge badge-${w.level}">${w.level}</span>
      </div>
      <div class="card-body">
        <div class="meanings">${meaningsHtml}</div>
        <div class="divider"></div>
        <div class="example-label">مثال</div>
        <div class="example">${w.ex}</div>
        <div class="example-ar">${w.ex_ar}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function filterCards() {
  currentSearch = document.getElementById('searchInput').value.toLowerCase().trim();
  applyFilters();
}

function filterLevel(level, btn) {
  currentLevel = level;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  let filtered = words;
  if (currentLevel !== 'all') {
    filtered = filtered.filter(w => w.level === currentLevel);
  }
  if (currentSearch) {
    filtered = filtered.filter(w =>
      w.word.toLowerCase().includes(currentSearch) ||
      w.meanings.some(m => m.ar.includes(currentSearch)) ||
      w.ex.toLowerCase().includes(currentSearch)
    );
  }
  renderCards(filtered);
}
